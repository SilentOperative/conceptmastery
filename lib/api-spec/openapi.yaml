openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: questions
    description: Question generation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /questions/generate:
    post:
      operationId: generateQuestions
      tags: [questions]
      summary: Generate similar questions
      description: Analyze question text and generate similar practice questions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateQuestionsBody"
      responses:
        "200":
          description: Generated questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateQuestionsResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateQuestionsBody:
      type: object
      properties:
        questionText:
          type: string
          description: The extracted question text from OCR or manual input
        subject:
          type: string
          enum: [Physics, Chemistry, Mathematics, Biology, General]
          description: Subject filter
        difficulty:
          type: string
          enum: [Easy, Medium, Hard, JEE Advanced]
          description: Desired difficulty level
        count:
          type: integer
          minimum: 3
          maximum: 10
          description: Number of questions to generate
      required:
        - questionText
    GenerateQuestionsResponse:
      type: object
      properties:
        topic:
          type: string
          description: Detected topic
        subject:
          type: string
          description: Detected subject
        difficulty:
          type: string
          description: Detected difficulty level
        questions:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedQuestion"
      required:
        - topic
        - subject
        - difficulty
        - questions
    GeneratedQuestion:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
          description: The question text
        answer:
          type: string
          description: The correct answer
        solution:
          type: string
          description: Step-by-step solution
        difficulty:
          type: string
          enum: [Easy, Medium, Hard, JEE Advanced]
        options:
          type: array
          items:
            type: string
          description: Multiple choice options (A, B, C, D)
      required:
        - id
        - text
        - answer
        - solution
        - difficulty
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
